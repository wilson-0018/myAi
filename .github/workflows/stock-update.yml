name: Update Stock Data

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30 开盘前
    - cron: '30 0 * * 1-5'
    # UTC 07:30 = 北京时间 15:30 收盘后30分钟
    - cron: '30 7 * * 1-5'
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

concurrency:
  group: "stock-update"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate stock-data.json
        run: python3 .github/scripts/update_stock_data.py

      - name: Commit and push to main
        run: |
          git config user.name 'Stock Bot'
          git config user.email 'bot@github.com'
          git add stock-data.json stock/stock-data.json stock/chip-stock-data.json
          if git diff --quiet --cached; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update stock data $(date '+%Y-%m-%d %H:%M')"
          git push origin HEAD
