// =====================================================
// 绘制迷你趋势线 (sparkline)
// =====================================================
function drawSparkline(canvasId, prices, isUp) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !prices || prices.length < 2) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = 2;
  const w = W - pad * 2, h = H - pad * 2;

  ctx.clearRect(0, 0, W, H);

  let min = Infinity, max = -Infinity;
  for (const p of prices) {
    if (p < min) min = p;
    if (p > max) max = p;
  }
  const range = max - min || 1;
  const margin = range * 0.05;
  min -= margin;
  max += margin;
  const r = max - min;

  const grad = ctx.createLinearGradient(0, pad, 0, H - pad);
  const lineColor = isUp ? 'rgba(239,68,68,1)' : 'rgba(34,197,94,1)';
  const fillColor = isUp ? 'rgba(239,68,68,0.15)' : 'rgba(34,197,94,0.15)';
  grad.addColorStop(0, fillColor);
  grad.addColorStop(1, 'rgba(0,0,0,0)');

  const step = w / (prices.length - 1);
  ctx.beginPath();
  for (let i = 0; i < prices.length; i++) {
    const x = pad + i * step;
    const y = pad + h - ((prices[i] - min) / r * h);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = lineColor;
  ctx.lineWidth = 1.2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.lineTo(pad + (prices.length - 1) * step, pad + h);
  ctx.lineTo(pad, pad + h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  const sy = pad + h - ((prices[0] - min) / r * h);
  const ey = pad + h - ((prices[prices.length-1] - min) / r * h);
  ctx.beginPath();
  ctx.arc(pad, sy, 1.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pad + (prices.length - 1) * step, ey, 2, 0, Math.PI * 2);
  ctx.fillStyle = lineColor;
  ctx.fill();
}

// =====================================================
// 批量拉取腾讯财经日K线
// =====================================================
function loadKlines(callback) {
  const codes = Object.keys(CM);
  let loaded = 0;
  const total = codes.length;
  const batchSize = 5;
  const gen = _refreshGen;

  function loadBatch(start) {
    const end = Math.min(start + batchSize, total);
    for (let i = start; i < end; i++) {
      const code = codes[i];
      const tencCode = toTencCode(CM[code]);
      const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${tencCode},day,,20,qfq`;
      const scr = document.createElement('script');
      const callbackName = 'kline_cb_' + code;
      window[callbackName] = function(data) {
        // 旧刷新轮的请求——忽略
        if (_refreshGen !== gen) { delete window[callbackName]; return; }
        try {
          const klines = data?.data?.[tencCode]?.qfqday || data?.data?.[tencCode]?.day;
          if (klines && klines.length >= 2) {
            klineData[code] = klines.map(k => parseFloat(k[2]));
          }
        } catch(e) {}
        delete window[callbackName];
        try { if (scr.parentNode) scr.parentNode.removeChild(scr); } catch(e) {}
        loaded++;
        if (loaded >= total && callback) callback();
      };
      const actualSrc = url + '&callback=' + callbackName;
      scr.src = actualSrc;
      scr.onerror = function() {
        if (_refreshGen !== gen) return;
        loaded++;
        delete window[callbackName];
        try { if (scr.parentNode) scr.parentNode.removeChild(scr); } catch(e) {}
        if (loaded >= total && callback) callback();
      };
      setTimeout(function() {
        if (window[callbackName]) {
          if (_refreshGen !== gen) { delete window[callbackName]; return; }
          loaded++;
          delete window[callbackName];
          if (loaded >= total && callback) callback();
        }
      }, 8000);
      document.body.appendChild(scr);
    }
  }

  loadBatch(0);
}

    <div class="gcard mb-3 overflow-x-auto"><table class="w-full"><thead><tr class="border-b border-white/5 bg-d2">
      <th class="text-left w-24 whitespace-nowrap">股票</th>
      <th class="text-center w-16">价格<br><span class="hint">涨跌幅</span></th>
      <th class="text-center w-9">PE</th>
      <th class="text-center w-9">YTD</th>
      <th class="text-center w-10">毛利率</th>
      <th class="text-center w-14">板块</th>
      <th class="trend-cell">月走势<br><span class="hint">20日</span></th>
      <th class="text-left">核心看点 · 美韩替代逻辑</th>
      <th class="text-center w-12">标签</th>
    </tr></thead><tbody>`;
    for (const x of g.s) {
      const kr = x.t.includes('⚠️');
      const ld = liveData[x.c];
      let priceDisplay;
      if (ld && ld.price) {
        const p = ld.price.toFixed(2);
        const c = ld.change_pct;
        const sign = c >= 0 ? '+' : '';
        const color = c >= 0 ? '#ef4444' : '#22c55e';
        priceDisplay = `<span class="font-mono font-semibold text-white text-[12px]">${p}</span><br><span class="font-mono text-[10px]" style="color:${color}">${sign}${c.toFixed(2)}%</span>`;
      } else {
        priceDisplay = '<span class="text-gray-500">—</span>';
      }

      const trendId = 'spk_' + x.c;
      const kPrices = klineData[x.c] || [];
      const isUp = kPrices.length >= 2 && kPrices[kPrices.length-1] >= kPrices[0];

      let trendHtml;
      if (kPrices.length >= 2) {
        trendHtml = `<canvas id="${trendId}" width="90" height="24"></canvas>`;
      } else {
        trendHtml = '<span class="text-gray-600 text-[9px]">—</span>';
      }

      let tl = '';
      if (x.t.includes('🏆')) tl += '<span class="tag bg-green-500/10 text-green-300">🏆 龙头</span> ';
      if (x.t.includes('💰')) tl += '<span class="tag bg-yellow-500/10 text-yellow-300">💰 业绩</span> ';
      if (x.t.includes('🎯')) tl += '<span class="tag bg-purple-500/10 text-purple-300">🎯 战略</span> ';
      if (x.t.includes('⚠️')) tl += '<span class="tag bg-red-500/10 text-red-300">⚠️ 美韩链</span> ';
      if (x.t.includes('📈')) tl += '<span class="tag bg-blue-500/10 text-blue-300">📈 增长</span> ';
      if (x.t.includes('唯一')) tl += '<span class="tag bg-blue-500/10 text-blue-300">唯一标的</span> ';
      let bc = '';
      if (x.b === '科创板') bc = 'bg-purple-500/10 text-purple-300 border border-purple-500/20';
      else if (x.b === '创业板') bc = 'bg-green-500/10 text-green-300 border border-green-500/20';
      else if (x.b === 'ETF') bc = 'bg-yellow-500/10 text-yellow-300 border border-yellow-500/20';
      else bc = 'bg-blue-500/10 text-blue-300 border border-blue-500/20';

      h += `<tr class="${kr?'kr':''}">
        <td><span style="color:#44ccff" class="font-mono text-[11px] font-semibold">${x.c}</span><br><span style="color:#44ccff" class="font-medium text-[12px]">${x.n}</span></td>
        <td class="text-center">${priceDisplay}</td>
        <td class="text-center font-mono text-[11px]">${x.p}</td>
        <td class="text-center font-mono text-[11px] text-green-400">${x.y}</td>
        <td class="text-center font-mono text-[11px] text-yellow-300">${x.g}</td>
        <td class="text-center font-mono text-[11px]"><span class="tag ${bc}">${x.b}</span></td>
        <td class="trend-cell">${trendHtml}</td>
        <td class="text-[11px] leading-relaxed">${x.k}</td>
        <td class="text-center whitespace-nowrap">${tl}</td>
      </tr>`;
      stockIdx++;
    }
    h += '</tbody></table></div>';
  }
  document.getElementById('app').innerHTML = h;

  for (const x of M) {
    const prices = klineData[x.c];
    if (prices && prices.length >= 2) {
      const isUp = prices[prices.length-1] >= prices[0];
      drawSparkline('spk_' + x.c, prices, isUp);
    }
  }
}

// =====================================================
// 新浪实时数据
// =====================================================
function loadSinaData(callback) {
  const st = document.getElementById('st');
  const sd = document.getElementById('sd');
  st.textContent = '加载行情...';

  const codes = Object.values(CM).join(',');
  const scr = document.createElement('script');
  const cbName = 'sina_cb_' + Date.now() + '_' + _refreshGen;
  const gen = _refreshGen;

  // 标记script，方便清理旧请求
  const oldScripts = document.querySelectorAll('script[data-sina="' + (_refreshGen - 1) + '"]');
  for (const old of oldScripts) {
    try { old.parentNode.removeChild(old); } catch(e) {}
  }
  scr.setAttribute('data-sina', '' + _refreshGen);

  window[cbName] = function() {};
  scr.src = 'https://hq.sinajs.cn/list=' + codes;
  scr.onload = function() {
    // 过时的请求——忽略
    if (_refreshGen !== gen) {
      delete window[cbName];
      try { if (scr.parentNode) scr.parentNode.removeChild(scr); } catch(e) {}
      return;
    }
    let n = 0, tradeDate = '';
    for (const [short, sinaCode] of Object.entries(CM)) {
      const v = window['hq_str_' + sinaCode];
      if (!v) continue;
      const a = v.split(',');
      if (a.length < 6) continue;
      const price = parseFloat(a[3]), prev = parseFloat(a[2]);
      if (price > 0) {
        const cg = prev > 0 ? Math.round((price - prev) / prev * 10000) / 100 : 0;
        liveData[short] = { price: Math.round(price * 100) / 100, change_pct: cg };
        n++;
      }
      if (a.length > 30 && a[30] && !tradeDate) tradeDate = a[30];
    }
    if (callback) callback(n, tradeDate);
    try { if (scr.parentNode) scr.parentNode.removeChild(scr); } catch(e) {}
    delete window[cbName];
  };
  scr.onerror = function() {
    if (_refreshGen !== gen) return;
    if (callback) callback(0, '');
    try { if (scr.parentNode) scr.parentNode.removeChild(scr); } catch(e) {}
    delete window[cbName];
  };
  document.body.appendChild(scr);
}

// =====================================================
// 启动
// =====================================================
function init() {
  document.getElementById('st').textContent = '加载行情+K线...';

  let sinaDone = false, klineDone = false;
  const gen = _refreshGen;
  let timeoutDone = false;

  function done() {
    if (timeoutDone) return;  // 超时已经处理过了
    const n = Object.keys(liveData).length;
    document.getElementById('st').textContent = (n >= 25 ? n + '只 ✅' : n + '只') + ' · 趋势线已绘制';
    document.getElementById('sd').className = 'w-1.5 h-1.5 rounded-full bg-green-400';
    document.getElementById('refreshBtn').disabled = false;
    timeoutDone = true;
  }

  // 超时保护：15秒后无论如何放开按钮（K线请求自己也有8秒超时）
  setTimeout(function() {
    if (_refreshGen !== gen) return;
    if (!sinaDone || !klineDone) {
      sinaDone = true; klineDone = true;
      done();
    }
  }, 15000);

  loadSinaData(function(n, tradeDate) {
    if (_refreshGen !== gen) return;
    sinaDone = true;
    if (n > 0) {
      document.getElementById('st').textContent = (tradeDate || '') + ' · ' + n + '只行情 ✅ 趋势线加载中...';
    }
    render();  // 先渲染表格（可能有部分/无趋势线）
    if (sinaDone && klineDone) done();
  });

  loadKlines(function() {
    if (_refreshGen !== gen) return;
    klineDone = true;
    // 重新绘制所有趋势线canvas
    for (const x of M) {
      const prices = klineData[x.c];
      if (prices && prices.length >= 2) {
        const isUp = prices[prices.length-1] >= prices[0];
        drawSparkline('spk_' + x.c, prices, isUp);
      }
    }
    if (sinaDone && klineDone) done();
  });
}

function reloadData() {
  _refreshGen++;  // 进入新的一代，所有旧回调自动失效
  document.getElementById('refreshBtn').disabled = true;
  document.getElementById('st').textContent = '刷新中...';
  document.getElementById('sd').className = 'w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse';
  // 纯清数据，不清理旧script标签
  liveData = {};
  klineData = {};
  init();
}

init();
</script>
