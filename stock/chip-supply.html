function loadData() {
  const st = document.getElementById('st');
  const sd = document.getElementById('sd');
  st.textContent = '加载数据...';
  if (sd) sd.className = 'w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse';

  fetch('./stock-data.json?t=' + Date.now())
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => {
      liveData = {};
      for (const [code, info] of Object.entries(d.stocks)) {
        for (const [short, sinaCode] of Object.entries(CM)) {
          if (sinaCode === code) { liveData[short] = info; break; }
        }
      }
      const count = Object.keys(liveData).length;
      st.textContent = d.update_time + ' · ' + count + '只' + (count >= 25 ? ' ✅' : '');
      if (sd) sd.className = 'w-1.5 h-1.5 rounded-full bg-green-400';
      render();
    })
    .catch(() => {
      st.textContent = '离线数据 (5/15收盘)';
      if (sd) sd.className = 'w-1.5 h-1.5 rounded-full bg-yellow-400';
      liveData = SD;
      render();
    });
}

function reloadData() {
  document.getElementById('st').textContent = '刷新中...';
  loadData();
}
