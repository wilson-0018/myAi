<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Week of Dinners — preview closed</title>
  <style>
    :root { --bg:#f4f3f1; --ink:#1c1b1a; --muted:#6b6966; --line:#e4e2de; --accent:#2a2927; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 420px; width: 100%; background: #fff; border: 1px solid var(--line);
      border-radius: 16px; padding: 32px 24px; text-align: center;
      box-shadow: 0 12px 40px rgba(28,27,26,.08);
    }
    h1 { font-size: 22px; letter-spacing: -0.02em; margin-bottom: 10px; }
    p { font-size: 14px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
    a.cta {
      display: inline-block; background: var(--accent); color: #fff; text-decoration: none;
      font-weight: 600; font-size: 14px; padding: 12px 18px; border-radius: 10px;
    }
    a.cta:hover { background: #111; }
    .foot { margin-top: 18px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <h1>This preview is closed</h1>
    <p>The playable prototype is no longer public. Join the waitlist if you want early access when we open spots.</p>
    <a class="cta" href="../waitlist/">Join the waitlist</a>
    <p class="foot">Weekdinner · prototype waitlist · not medical advice</p>
  </main>
</body>
</html>
